id: ascend-superpods
title: Huawei Atlas SuperPoDs
title_zh: 华为 Atlas SuperPoD
summary: >-
  Huawei's answer to NVL72 is not a better chip, it is a much larger coherent
  domain. Where a GB300 NVL72 rack holds 72 GPUs, an Atlas 950 puts 8,192
  accelerators on one interconnect.
summary_zh: >-
  华为对 NVL72 的回应不是更强的芯片，而是大得多的一致性域。
  GB300 NVL72 一个机柜 72 卡，Atlas 950 是 8,192 张卡挂在同一套互联上。
orientation: columns
fields:
  - {key: chips,          label: Accelerators,          label_zh: 加速卡数量}
  - {key: memory,         label: Total memory,          label_zh: 总内存}
  - {key: interconnect,   label: Interconnect BW,       label_zh: 互联总带宽}
  - {key: fp8,            label: FP8 compute,           label_zh: FP8 算力}
  - {key: fp4,            label: FP4 compute,           label_zh: FP4 算力}
  - {key: cabinets,       label: Cabinets,              label_zh: 机柜数}
  - {key: nvidia_peer,    label: NVIDIA counterpart,    label_zh: NVIDIA 对位}
  - {key: availability,   label: Availability,          label_zh: 可用时间}
items:
  - id: atlas-900-a3
    name: Atlas 900 A3 (CloudMatrix 384)
    specs:
      chips: 384 x Ascend 910C
      memory: not officially published
      interconnect: Unified Bus, all-to-all non-blocking
      fp8: not officially published
      fp4: not cited by Huawei; MXFP4 first appears with the 950 series
      cabinets: 16
      nvidia_peer: GB200 NVL72
      availability: March 2025, 300+ deployed
    specs_zh:
      memory: 未公布
      interconnect: Unified Bus，全互联无阻塞
      fp8: 未公布
      fp4: 华为未提及；MXFP4 自 950 系列才出现
      nvidia_peer: GB200 NVL72
      availability: 2025 年 3 月，已部署 300+ 套
    sources:
      - https://www.huawei.com/en/news/2025/9/hc-xu-keynote-speech
  - id: atlas-950
    name: Atlas 950 SuperPoD
    specs:
      chips: 8,192 x Ascend 950DT
      memory: 1,152 TB
      interconnect: 16 PB/s
      fp8: 8 EFLOPS
      fp4: 16 EFLOPS
      cabinets: 160 (128 compute + 32 comms)
      nvidia_peer: beyond NVL72 scale - compare at cluster level
      availability: Q4 2026
    specs_zh:
      cabinets: 160（128 计算 + 32 通信）
      nvidia_peer: 已超出 NVL72 的尺度，只能在集群层面比
      availability: 2026 Q4
    sources:
      - https://www.huawei.com/en/news/2025/9/hc-xu-keynote-speech
  - id: atlas-960
    name: Atlas 960 SuperPoD
    specs:
      chips: 15,488 x Ascend 960
      memory: 4,460 TB
      interconnect: 34 PB/s
      fp8: 30 EFLOPS
      fp4: 60 EFLOPS
      cabinets: 220 (176 compute + 44 comms)
      nvidia_peer: beyond NVL72 scale - compare at cluster level
      availability: Q4 2027
    specs_zh:
      cabinets: 220（176 计算 + 44 通信）
      nvidia_peer: 已超出 NVL72 的尺度，只能在集群层面比
      availability: 2027 Q4
    sources:
      - https://www.huawei.com/en/news/2025/9/hc-xu-keynote-speech
notes:
  - >-
    Compare like with like. A GB300 NVL72 is one rack; an Atlas 950 is 160
    cabinets. Huawei is trading power and floor space for domain size because
    per-chip it cannot match Blackwell on process node.
  - >-
    Everything here is from Huawei's own Huawei Connect 2025 keynote. Widely
    quoted CloudMatrix figures such as "48 TB HBM" and "300 PFLOPS dense BF16"
    come from analyst teardowns, not Huawei, and are left out.
  - >-
    Power draw is the number Huawei does not headline and NVIDIA does. Treat
    any performance-per-watt comparison against NVL72 with suspicion until
    someone publishes measured rack power.
notes_zh:
  - >-
    比的时候要注意口径。GB300 NVL72 是一个机柜，Atlas 950 是 160 个机柜。
    华为是拿功耗和占地换互联域规模，因为单芯片受制程限制打不过 Blackwell。
  - >-
    本表数据全部出自华为全联接 2025 的主题演讲。流传很广的 CloudMatrix "48 TB HBM"、
    "300 PFLOPS 稠密 BF16" 等数字来自分析机构拆解，不是华为公布的，这里没有采用。
  - >-
    功耗是华为不放在标题里、而 NVIDIA 会放的数字。在有人公布实测整柜功耗之前，
    任何和 NVL72 的能效比对比都该打个问号。
