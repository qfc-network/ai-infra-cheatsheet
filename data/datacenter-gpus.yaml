id: datacenter-gpus
title: Flagship Data Center GPUs (SXM)
title_zh: 数据中心旗舰 GPU（SXM）
summary: >-
  Chip-level comparison of the SXM parts that go into HGX baseboards and DGX
  nodes. Numbers are per single GPU.
summary_zh: >-
  用于 HGX 基板与 DGX 整机的 SXM 芯片级对比，所有数字均为单卡值。
orientation: columns
fields:
  - {key: architecture,     label: Architecture,            label_zh: 架构}
  - {key: process,          label: Process,                 label_zh: 制程}
  - {key: transistors,      label: Transistors,             label_zh: 晶体管数}
  - {key: dies,             label: Dies per package,        label_zh: 封装内 die 数}
  - {key: memory,           label: Memory,                  label_zh: 显存}
  - {key: bandwidth,        label: Memory bandwidth,        label_zh: 显存带宽}
  - {key: fp64,             label: FP64 / FP64 Tensor,      label_zh: FP64 / FP64 张量}
  - {key: tf32,             label: TF32 Tensor (dense),     label_zh: TF32 张量（稠密）}
  - {key: bf16,             label: FP16/BF16 Tensor (dense),label_zh: FP16/BF16 张量（稠密）}
  - {key: fp8,              label: FP8 Tensor (dense),      label_zh: FP8 张量（稠密）}
  - {key: fp4,              label: FP4 Tensor (dense),      label_zh: FP4 张量（稠密）}
  - {key: nvlink,           label: NVLink,                  label_zh: NVLink}
  - {key: tdp,              label: TDP,                     label_zh: 功耗}
  - {key: mig,              label: MIG instances,           label_zh: MIG 实例}
  - {key: launch,           label: Launch,                  label_zh: 上市时间}
items:
  - id: p100
    name: P100 SXM
    specs:
      architecture: Pascal (GP100)
      process: TSMC 16nm FinFET
      transistors: 15.3 B
      dies: 1
      memory: 16 GB HBM2
      bandwidth: 732 GB/s
      fp64: 5.3 TFLOPS / no FP64 Tensor
      tf32: not supported
      bf16: no Tensor Cores (21.2 TFLOPS FP16 vector)
      fp8: not supported
      fp4: not supported
      nvlink: NVLink 1, 160 GB/s
      tdp: 300 W
      mig: not supported
      launch: 2016
    specs_zh:
      fp64: 5.3 TFLOPS / 无 FP64 张量核
      tf32: 不支持
      bf16: 无 Tensor Core（FP16 向量 21.2 TFLOPS）
      fp8: 不支持
      fp4: 不支持
      mig: 不支持
    sources:
      - https://www.nvidia.com/en-us/data-center/tesla-p100/
  - id: v100
    name: V100 SXM2
    specs:
      architecture: Volta (GV100)
      process: TSMC 12nm FFN
      transistors: 21.1 B
      dies: 1
      memory: 16 or 32 GB HBM2
      bandwidth: 900 GB/s
      fp64: 7.8 TFLOPS / no FP64 Tensor
      tf32: not supported
      bf16: 125 TFLOPS (FP16 only, no BF16)
      fp8: not supported
      fp4: not supported
      nvlink: NVLink 2, 300 GB/s
      tdp: 300 W (350 W SXM3)
      mig: not supported
      launch: 2017
    specs_zh:
      memory: 16 或 32 GB HBM2
      fp64: 7.8 TFLOPS / 无 FP64 张量核
      tf32: 不支持
      bf16: 125 TFLOPS（仅 FP16，无 BF16）
      fp8: 不支持
      fp4: 不支持
      mig: 不支持
    sources:
      - https://www.nvidia.com/en-us/data-center/v100/
  - id: a100
    name: A100 SXM4
    specs:
      architecture: Ampere (GA100)
      process: TSMC N7
      transistors: 54.2 B
      dies: 1
      memory: 80 GB HBM2e
      bandwidth: 2,039 GB/s
      fp64: 9.7 / 19.5 TFLOPS
      tf32: 156 TFLOPS
      bf16: 312 TFLOPS
      fp8: not supported
      fp4: not supported
      nvlink: NVLink 3, 600 GB/s
      tdp: 400 W (up to 500 W)
      mig: up to 7
      launch: 2020
    specs_zh:
      fp8: 不支持
      fp4: 不支持
    sources:
      - https://www.nvidia.com/en-us/data-center/a100/
  - id: h100
    name: H100 SXM5
    specs:
      architecture: Hopper (GH100)
      process: TSMC 4N
      transistors: 80 B
      dies: 1
      memory: 80 GB HBM3
      bandwidth: 3,350 GB/s
      fp64: 34 / 67 TFLOPS
      tf32: 495 TFLOPS
      bf16: 989 TFLOPS
      fp8: 1,979 TFLOPS
      fp4: not supported
      nvlink: NVLink 4, 900 GB/s
      tdp: up to 700 W
      mig: up to 7
      launch: 2022
    specs_zh:
      fp4: 不支持
    sources:
      - https://www.nvidia.com/en-us/data-center/h100/
      - https://resources.nvidia.com/en-us-hopper-architecture
  - id: h200
    name: H200 SXM5
    specs:
      architecture: Hopper (GH100)
      process: TSMC 4N
      transistors: 80 B
      dies: 1
      memory: 141 GB HBM3e
      bandwidth: 4,800 GB/s
      fp64: 34 / 67 TFLOPS
      tf32: 495 TFLOPS
      bf16: 989 TFLOPS
      fp8: 1,979 TFLOPS
      fp4: not supported
      nvlink: NVLink 4, 900 GB/s
      tdp: up to 700 W
      mig: up to 7
      launch: 2023
    specs_zh:
      fp4: 不支持
    sources:
      - https://www.nvidia.com/en-us/data-center/h200/
  - id: b200
    name: B200 SXM
    specs:
      architecture: Blackwell
      process: TSMC 4NP
      transistors: 208 B
      dies: 2 (chip-to-chip 10 TB/s)
      memory: 180-192 GB HBM3e
      bandwidth: 7.7-8 TB/s
      fp64: 40 TFLOPS (FP64 Tensor)
      tf32: 1.1 PFLOPS
      bf16: 2.2 PFLOPS
      fp8: 4.5 PFLOPS
      fp4: 9 PFLOPS
      nvlink: NVLink 5, 1.8 TB/s
      tdp: 1,000 W (1,200 W in GB200)
      mig: up to 7
      launch: 2024
    specs_zh:
      dies: 2（片间 10 TB/s）
    sources:
      - https://www.nvidia.com/en-us/data-center/technologies/blackwell-architecture/
      - https://resources.nvidia.com/en-us-blackwell-architecture
  - id: b300
    name: B300 SXM
    specs:
      architecture: Blackwell Ultra
      process: TSMC 4NP
      transistors: 208 B
      dies: 2 (chip-to-chip 10 TB/s)
      memory: 288 GB HBM3e
      bandwidth: 8 TB/s
      fp64: de-emphasized vs B200
      tf32: 1.1 PFLOPS
      bf16: 2.2 PFLOPS
      fp8: 4.5 PFLOPS
      fp4: 13.5 PFLOPS (15 PFLOPS in GB300)
      nvlink: NVLink 5, 1.8 TB/s
      tdp: ~1,400 W
      mig: up to 7
      launch: 2025
    specs_zh:
      dies: 2（片间 10 TB/s）
      fp64: 相对 B200 大幅弱化
      fp4: 13.5 PFLOPS（GB300 中为 15 PFLOPS）
    sources:
      - https://www.nvidia.com/en-us/data-center/gb300-nvl72/
notes:
  - >-
    Volta and Pascal predate structured sparsity, TF32, BF16 and MIG; V100
    Tensor Cores are FP16-only.
  - >-
    Multiply the dense numbers by 2 for the sparse (2:4 structured sparsity)
    figures NVIDIA quotes in marketing material.
  - >-
    The same die ships in different power/memory bins: HGX/DGX air-cooled parts
    are clocked lower than the liquid-cooled superchip variants.
notes_zh:
  - >-
    Volta 与 Pascal 早于结构化稀疏、TF32、BF16 和 MIG；V100 的 Tensor Core 只支持 FP16。
  - 稠密算力 x2 即为 NVIDIA 宣传常用的稀疏（2:4 结构化稀疏）算力。
  - 同一颗 die 会按功耗/显存分档：风冷 HGX/DGX 版本频率低于液冷超级芯片版本。
