id: amd-gpus
title: AMD Instinct Accelerators
title_zh: AMD Instinct 加速卡
summary: >-
  AMD's data center GPU line. HBM capacity has been AMD's consistent lead over
  the equivalent NVIDIA part; scale-up domain size is where it falls behind.
summary_zh: >-
  AMD 的数据中心 GPU 线。相对同期 NVIDIA 产品，AMD 一直在 HBM 容量上领先，
  短板在 scale-up 域的规模。
orientation: columns
fields:
  - {key: architecture,  label: Architecture,             label_zh: 架构}
  - {key: process,       label: Process,                  label_zh: 制程}
  - {key: cu,            label: Compute units,            label_zh: 计算单元}
  - {key: memory,        label: Memory,                   label_zh: 显存}
  - {key: bandwidth,     label: Memory bandwidth,         label_zh: 显存带宽}
  - {key: fp64,          label: FP64 matrix,              label_zh: FP64 矩阵}
  - {key: fp16,          label: FP16/BF16 (dense),        label_zh: FP16/BF16（稠密）}
  - {key: fp8,           label: FP8 (dense),              label_zh: FP8（稠密）}
  - {key: fp4,           label: FP4 / MXFP4 (dense),      label_zh: FP4 / MXFP4（稠密）}
  - {key: interconnect,  label: GPU interconnect,         label_zh: GPU 互联}
  - {key: tbp,           label: Total board power,        label_zh: 整卡功耗}
  - {key: cooling,       label: Cooling,                  label_zh: 散热}
  - {key: launch,        label: Launch,                   label_zh: 上市时间}
