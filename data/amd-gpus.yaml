  - id: mi355x
    name: MI355X
    specs:
      architecture: CDNA 4
      process: TSMC 3nm + 6nm chiplets
      cu: 256
      memory: 288 GB HBM3E
      bandwidth: 8 TB/s
      fp64: ~78.6 TFLOPS
      fp16: 2.5 PFLOPS
      fp8: 5.0 PFLOPS
      fp4: 10 PFLOPS
      interconnect: Infinity Fabric 4th gen, 8-GPU mesh
      tbp: 1,400 W
      cooling: direct liquid
      launch: 2025
