      bandwidth: 5.3 TB/s
      fp64: 163.4 TFLOPS
      fp16: 1.3 PFLOPS
      fp8: 2.6 PFLOPS
      fp4: not supported
      interconnect: Infinity Fabric, 8-GPU fully connected mesh
      tbp: 750 W
      cooling: air
