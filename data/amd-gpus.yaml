notes:
  - >-
    AMD quotes MXFP4 and MXFP6 (OCP microscaling formats) where NVIDIA quotes
    NVFP4. They are different 4-bit encodings with different scaling-block
    layouts; a model quantized for one is not automatically portable.
  - >-
    CDNA 4 traded FP64 away: MI355X FP64 matrix is roughly half MI300X's, after
    CDNA 3 had been the HPC-friendly choice. Same direction NVIDIA took with
    Blackwell Ultra.
  - >-
    Sparsity does not apply to the 4-bit formats. AMD's datasheets carry a
    with-sparsity column for FP16, BF16, INT8 and OCP-FP8 only; MXFP6 and MXFP4
    show N/A, so the FP4 figures here are the peak, not half of it.
notes_zh:
  - >-
    AMD 标的是 MXFP4 / MXFP6（OCP microscaling 格式），NVIDIA 标的是 NVFP4。
    两者是不同的 4bit 编码，缩放块布局也不同，为其一量化的模型不能直接搬到另一边。
  - >-
    CDNA 4 砍掉了 FP64：MI355X 的 FP64 矩阵算力大约只有 MI300X 的一半，
    而 CDNA 3 本来是 HPC 友好的选择。NVIDIA 在 Blackwell Ultra 上是同一个方向。
  - >-
    4bit 格式没有稀疏加成。AMD 规格书里只有 FP16、BF16、INT8 和 OCP-FP8 有"含稀疏"
    那一列，MXFP6 和 MXFP4 都是 N/A——所以表里的 FP4 数字就是峰值本身，不是峰值的一半。
