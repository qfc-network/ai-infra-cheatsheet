      memory_bandwidth: 900 GB/s
      fp4: not supported
      fp8: not supported
      fp16: 2 PFLOPS (dense)
      interconnect: NVLink 2 / NVSwitch 1 (12 switches)
      nvlink_bw: 300 GB/s
      cluster_network: 8 x 100 Gbit/s (EDR IB)
      cpu: 2 x Intel Xeon Platinum 8168 (24C)
      system_memory: 1.5 TB DDR4
      storage: 8 x 3.84 TB NVMe + 2 x 960 GB (OS)
