id: dgx-systems
title: DGX Systems
title_zh: DGX 整机
summary: >-
  NVIDIA's own appliance line, from the 2017 DGX-1 to today's Blackwell Ultra
  nodes. Every generation since DGX-2 puts all GPUs in the box on one NVSwitch
  fabric; DGX-1 used a direct NVLink mesh instead.
summary_zh: >-
  NVIDIA 官方整机产品线，从 2017 年的 DGX-1 到今天的 Blackwell Ultra 节点。
  DGX-2 之后每一代都把机内 GPU 挂在同一个 NVSwitch 全互联域上，
  只有 DGX-1 用的是 NVLink 直连网格。
orientation: columns
fields:
  - {key: architecture,       label: Architecture,          label_zh: 架构}
  - {key: gpu,                label: GPU,                   label_zh: GPU}
  - {key: memory_per_gpu,     label: Memory per GPU,        label_zh: 单卡显存}
  - {key: memory_total,       label: Total GPU memory,      label_zh: 整机显存}
  - {key: memory_bandwidth,   label: Memory bandwidth/GPU,  label_zh: 单卡显存带宽}
  - {key: fp4,                label: FP4 (sparse/dense),    label_zh: FP4（稀疏/稠密）}
  - {key: fp8,                label: FP8 (sparse/dense),    label_zh: FP8（稀疏/稠密）}
  - {key: fp16,               label: FP16/BF16 Tensor,      label_zh: FP16/BF16 张量}
  - {key: interconnect,       label: GPU interconnect,      label_zh: GPU 互联}
  - {key: nvlink_bw,          label: NVLink BW per GPU,     label_zh: 单卡 NVLink 带宽}
  - {key: cluster_network,    label: Cluster network,       label_zh: 集群网络}
  - {key: cpu,                label: CPU,                   label_zh: CPU}
  - {key: system_memory,      label: System memory,         label_zh: 系统内存}
  - {key: storage,            label: Internal NVMe,         label_zh: 内置 NVMe}
  - {key: height,             label: Height,                label_zh: 高度}
  - {key: power,              label: Max power,             label_zh: 最大功耗}
  - {key: cooling,            label: Cooling,               label_zh: 散热}
  - {key: launch,             label: Announced,             label_zh: 发布时间}
items:
  - id: dgx-1
    name: DGX-1 (V100)
    specs:
      architecture: Volta
      gpu: 8 x V100 SXM2
      memory_per_gpu: 16 GB, later 32 GB HBM2
      memory_total: 128 GB (256 GB with 32 GB V100)
      memory_bandwidth: 900 GB/s
      fp4: not supported
      fp8: not supported
      fp16: 1 PFLOPS (dense)
      interconnect: NVLink 2 hybrid cube mesh (no NVSwitch)
      nvlink_bw: 300 GB/s
      cluster_network: 4 x 100 Gbit/s (EDR IB) + 2 x 10 GbE
      cpu: 2 x Intel Xeon E5-2698 v4 (20C)
      system_memory: 512 GB DDR4
      storage: 4 x 1.92 TB SSD (RAID 0)
      height: 3U
      power: 3.5 kW
      cooling: air
      launch: 2017
    specs_zh:
      fp16: 1 PFLOPS（稠密）
      memory_per_gpu: 16 GB，后期 32 GB HBM2
      memory_total: 128 GB（32 GB 版 V100 为 256 GB）
      fp4: 不支持
      fp8: 不支持
      interconnect: NVLink 2 立方网格直连（无 NVSwitch）
      cooling: 风冷
    sources:
      - https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/dgx-1/NVIDIA-DGX-1-Volta-AI-Supercomputer-Datasheet.pdf
      - https://images.nvidia.com/content/pdf/dgx1-v100-system-architecture-whitepaper.pdf
