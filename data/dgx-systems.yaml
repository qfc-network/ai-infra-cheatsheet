notes:
  - >-
    Peak FLOPS are dense unless a sparse/dense pair is given; NVIDIA marketing
    numbers usually quote the sparse (2:4 structured sparsity) figure.
  - >-
    B200 is documented as 192 GB HBM3e at the chip level; DGX B200 ships a
    180 GB per-GPU configuration (1,440 GB per node).
notes_zh:
  - >-
    未特别标注时算力为稠密值；NVIDIA 官方宣传数字通常是稀疏（2:4 结构化稀疏）值。
  - >-
    B200 芯片规格为 192 GB HBM3e，但 DGX B200 整机按每卡 180 GB 配置（整机 1,440 GB）。
