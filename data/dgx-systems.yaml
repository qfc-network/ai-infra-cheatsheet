notes:
  - >-
    DGX-2 is the odd one out at 16 GPUs; every other DGX node here is an 8-GPU
    system. It was also the debut of NVSwitch.
  - >-
    DGX B300 GPU memory is listed by NVIDIA as 2.1 TB per node; 8 x 288 GB of
    B300 chip capacity would be 2.3 TB, so the shipping configuration reserves
    part of it.
  - >-
    Peak FLOPS are dense unless a sparse/dense pair is given; NVIDIA marketing
    numbers usually quote the sparse (2:4 structured sparsity) figure.
  - >-
    B200 is documented as 192 GB HBM3e at the chip level; DGX B200 ships a
    180 GB per-GPU configuration (1,440 GB per node).
notes_zh:
  - >-
    DGX-2 是唯一的 16 卡机型，其余 DGX 节点都是 8 卡；它也是 NVSwitch 的首发平台。
  - >-
    NVIDIA 官方页面标注 DGX B300 整机显存为 2.1 TB；按 B300 芯片 8 x 288 GB 计算应为
    2.3 TB，说明出厂配置保留了一部分。
  - >-
    未特别标注时算力为稠密值；NVIDIA 官方宣传数字通常是稀疏（2:4 结构化稀疏）值。
  - >-
    B200 芯片规格为 192 GB HBM3e，但 DGX B200 整机按每卡 180 GB 配置（整机 1,440 GB）。
