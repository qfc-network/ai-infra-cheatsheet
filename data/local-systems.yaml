id: local-systems
title: Desktop & Local AI Systems
title_zh: 桌面与本地 AI 主机
summary: >-
  Boxes you can put on a desk and run a model on. Two different bets: unified
  memory (lots of capacity, moderate bandwidth) versus a discrete GPU (little
  capacity, huge bandwidth). Decode speed tracks bandwidth; what fits at all
  tracks capacity.
summary_zh: >-
  能摆在桌上直接跑模型的机器，分两条路线：统一内存（容量大、带宽中等）
  和独立显卡（容量小、带宽极高）。能装下多大模型看容量，出词多快看带宽。
orientation: columns
fields:
  - {key: chip,        label: Chip,                    label_zh: 芯片}
  - {key: memory,      label: Memory for the model,    label_zh: 可用于模型的内存}
  - {key: bandwidth,   label: Memory bandwidth,        label_zh: 内存带宽}
  - {key: ai_perf,     label: Vendor AI figure,        label_zh: 厂商标称算力}
  - {key: precision,   label: Low precision support,   label_zh: 低精度支持}
  - {key: network,     label: Networking,              label_zh: 网络}
  - {key: clustering,  label: Multi-box linking,       label_zh: 多机互联}
  - {key: power,       label: System power,            label_zh: 整机功耗}
  - {key: fits,        label: Rough model ceiling,     label_zh: 大致能跑到多大}
  - {key: launch,      label: Launch,                  label_zh: 上市时间}
