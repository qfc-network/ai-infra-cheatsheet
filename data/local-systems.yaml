notes:
  - >-
    Ryzen AI Max+ 395 ships in the Framework Desktop, GMKtec EVO-X2, HP ZBook
    Ultra G1a and AMD's own Ryzen AI Halo developer platform. It is AMD's answer
    to DGX Spark and the Mac Studio: unified memory, no FP4, no cluster fabric.
  - >-
    "GB10 OEM boxes" are the same GB10 superchip in someone else's case - ASUS
    Ascent GX10, Dell Pro Max with GB10, HP ZGX Nano, Lenovo and MSI all ship
    one. They differ in storage, chassis and price, not in compute or bandwidth.
  - >-
    Bandwidth is the number to watch for token generation. A 5090 has 6.6x the
    bandwidth of a DGX Spark but a quarter of the memory: the Spark runs models
    the 5090 cannot load at all, and the 5090 runs the models that fit far
    faster.
  - >-
    Apple does not publish FLOPS in a form comparable to NVIDIA's AI TOPS, and
    Apple Silicon has no FP4/FP8 tensor path, so 4-bit models are dequantized in
    software. Capacity and bandwidth are the honest comparison points.
  - >-
    None of these are cluster hardware. DGX Spark's ConnectX-7 is the only real
    fabric here, and it tops out at 4 boxes; Thunderbolt between Macs is not
    comparable to NVLink or InfiniBand.
notes_zh:
  - >-
    Ryzen AI Max+ 395 用在 Framework Desktop、GMKtec EVO-X2、HP ZBook Ultra G1a
    以及 AMD 自己的 Ryzen AI Halo 开发平台上。它是 AMD 对标 DGX Spark 和 Mac Studio
    的方案：统一内存、无 FP4、无集群网络。
  - >-
    "GB10 OEM 机型" 就是同一颗 GB10 换了个壳：华硕 Ascent GX10、戴尔 Pro Max with GB10、
    惠普 ZGX Nano、联想和微星都有。差别在存储、机箱和价格，算力与带宽完全一样。
  - >-
    看出词速度就看带宽。5090 的带宽是 DGX Spark 的 6.6 倍，但内存只有四分之一：
    Spark 能跑 5090 根本装不下的模型，而装得下的模型 5090 快得多。
  - >-
    苹果没有公布可与 NVIDIA AI TOPS 对比的算力口径，且 Apple Silicon 没有 FP4/FP8
    张量通路，4bit 模型要靠软件反量化。容量和带宽才是能诚实对比的两项。
  - >-
    这些都不是集群硬件。这里只有 DGX Spark 的 ConnectX-7 算真正的互联网络，且最多 4 台；
    Mac 之间的雷雳连接和 NVLink、InfiniBand 不是一个量级。
