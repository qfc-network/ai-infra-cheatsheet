id: amd-systems
title: AMD Instinct Platforms & Racks
title_zh: AMD Instinct 整机与机柜
summary: >-
  AMD sells an 8-GPU OAM baseboard (the "platform") to OEMs rather than a
  branded appliance like DGX. The scale-up domain stops at 8 GPUs until Helios.
summary_zh: >-
  AMD 卖的是 8 卡 OAM 基板（"platform"）给 OEM，而不是 DGX 那样的自有整机品牌。
  在 Helios 之前，其 scale-up 域上限就是 8 卡。
orientation: columns
fields:
  - {key: gpus,          label: GPUs,                    label_zh: GPU 数量}
  - {key: memory_total,  label: Total GPU memory,        label_zh: 整机显存}
  - {key: bandwidth,     label: Aggregate bandwidth,     label_zh: 总显存带宽}
  - {key: fp8,           label: FP8 (dense),             label_zh: FP8（稠密）}
  - {key: fp4,           label: FP4 / MXFP4 (dense),     label_zh: FP4 / MXFP4（稠密）}
  - {key: scale_up,      label: Scale-up domain,         label_zh: scale-up 域}
  - {key: scale_out,     label: Scale-out network,       label_zh: 横向扩展网络}
  - {key: cooling,       label: Cooling,                 label_zh: 散热}
  - {key: packaging,     label: Sold as,                 label_zh: 交付形态}
  - {key: launch,        label: Availability,            label_zh: 上市时间}
