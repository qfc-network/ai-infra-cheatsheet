notes:
  - >-
    This is the structural difference, not a spec-sheet one. An MI355X node is
    8 GPUs in one coherent domain; a GB300 NVL72 rack is 72. Anything larger
    than 8 GPUs on AMD crosses the network today, which changes how you shard a
    model.
  - >-
    AMD's answer is UALink (an open scale-up interconnect standard) plus Ultra
    Ethernet for scale-out, arriving with Helios. Open standards versus NVIDIA's
    vertically integrated NVLink is the actual strategic bet.
  - >-
    There is no DGX equivalent: AMD ships baseboards, and Dell, HPE, Supermicro
    and others build the box. Chassis power and physical specs therefore vary by
    OEM and are not listed here.
notes_zh:
  - >-
    这才是结构性差异，不是规格表上的差异。一台 MI355X 是 8 卡一个一致性域，
    一个 GB300 NVL72 机柜是 72 卡。今天在 AMD 上超过 8 卡就要过网络，
    这会直接改变模型怎么切分。
  - >-
    AMD 的答案是 UALink（开放的 scale-up 互联标准）加 Ultra Ethernet 做横向扩展，
    随 Helios 一起落地。开放标准 vs NVIDIA 垂直整合的 NVLink，这才是真正的战略分歧。
  - >-
    AMD 没有 DGX 的对应物：它出基板，戴尔、慧与、超微等厂商做整机。
    所以机箱功耗和物理规格因 OEM 而异，本表不列。
