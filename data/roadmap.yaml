id: roadmap
title: Platform Roadmap
title_zh: 平台路线图
summary: >-
  NVIDIA's publicly stated one-architecture-per-year cadence. Everything from
  2026 on is announcement-level information.
summary_zh: >-
  NVIDIA 公开宣布的"一年一代架构"节奏。2026 年及以后均为发布会公布信息，非量产规格。
orientation: rows
fields:
  - {key: year,     label: Year,          label_zh: 年份}
  - {key: gpu,      label: GPU,           label_zh: GPU}
  - {key: cpu,      label: CPU,           label_zh: CPU}
  - {key: memory,   label: GPU memory,    label_zh: GPU 显存}
  - {key: nvlink,   label: NVLink,        label_zh: NVLink}
  - {key: network,  label: Network,       label_zh: 网络}
  - {key: rack,     label: Rack system,   label_zh: 机柜系统}
items:
