    name: Hopper
    specs: {year: "2022-2023", gpu: H100 / H200, cpu: Grace (GH200), memory: HBM3 / HBM3e, nvlink: NVLink 4, network: Quantum-2 NDR 400G, rack: "-"}
  - id: blackwell
    name: Blackwell
    specs: {year: "2024-2025", gpu: B200, cpu: Grace (GB200), memory: HBM3e 180-192 GB, nvlink: NVLink 5, network: Quantum-X800 / Spectrum-X, rack: GB200 NVL72}
  - id: blackwell-ultra
    name: Blackwell Ultra
    specs: {year: "2025", gpu: B300, cpu: Grace (GB300), memory: HBM3e 288 GB, nvlink: NVLink 5, network: ConnectX-8 800G, rack: GB300 NVL72}
  - id: rubin
    name: Rubin
    specs: {year: "2026", gpu: Rubin, cpu: Vera, memory: HBM4 288 GB, nvlink: NVLink 6, network: ConnectX-9 / Spectrum-X, rack: Vera Rubin NVL144}
  - id: rubin-ultra
