    specs: {year: "2027", gpu: Rubin Ultra, cpu: Vera, memory: HBM4e, nvlink: NVLink 7, network: Spectrum-X / Quantum next-gen, rack: Rubin Ultra NVL576}
  - id: feynman
    name: Feynman
    specs: {year: "2028", gpu: Feynman, cpu: Vera, memory: TBA, nvlink: TBA, network: TBA, rack: TBA}
    specs_zh: {memory: 未公布, nvlink: 未公布, network: 未公布, rack: 未公布}
notes:
  - Roadmap rows are from GTC keynotes and press releases; treat dates and specs as targets, not commitments.
notes_zh:
  - 路线图内容来自 GTC 主题演讲与新闻稿，时间与规格均为目标值而非承诺。
