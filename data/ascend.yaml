notes:
  - >-
    For scale: an Ascend 950 at 1 PFLOPS FP8 sits near a B200 (4.5 PFLOPS FP8
    dense) per chip. Huawei's strategy is not per-chip parity - it is putting
    far more chips in one interconnect domain, which the SuperPoD table shows.
  - >-
    Widely circulated 910B and 910C figures (64/128 GB HBM, 376/780 TFLOPS)
    come from analysts and secondary reporting, not Huawei. They are omitted
    here rather than presented as specifications.
notes_zh:
  - >-
    对比一下量级：昇腾 950 的 1 PFLOPS FP8，单芯片大致在 B200（稠密 4.5 PFLOPS FP8）
    的量级之下。华为的策略本来也不是单芯片对标，而是把远多的芯片放进同一个互联域里——
    这一点看 SuperPoD 那张表更清楚。
  - >-
    流传很广的 910B / 910C 数字（64/128 GB HBM、376/780 TFLOPS）来自分析机构和二手报道，
    不是华为公布的。这里选择留空而不是当作规格写进去。
