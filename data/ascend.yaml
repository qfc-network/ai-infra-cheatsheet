id: ascend
title: Huawei Ascend Accelerators
title_zh: 华为昇腾加速卡
summary: >-
  Huawei publishes compute and interconnect figures for the 950 series and later
  but never released per-chip datasheets for the 910B or 910C, so the older rows
  are marked as unpublished rather than filled with analyst estimates.
summary_zh: >-
  华为公布了 950 系列及以后的算力与互联数字，但从未发布 910B / 910C 的单芯片规格书，
  所以老型号这几行标注为"未公布"，而不是填分析师的估算值。
