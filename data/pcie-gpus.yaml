notes:
  - >-
    Power is the real axis. A 70 W L4 or T4 fits a standard server with no
    changes; an L40S at 350 W needs airflow planning; an H200 NVL at up to 600 W
    needs a chassis designed for it. That constraint, not FLOPS, is usually what
    decides which card a fleet standardises on.
  - >-
    Only the HBM cards get MIG and an NVLink bridge. On GDDR6 cards, multi-card
    work goes over PCIe and each card's memory stays its own; the H100 NVL and
    H200 NVL can pair or quad up over a bridge instead.
  - >-
    H100 NVL and H200 NVL are the same Hopper die in the same PCIe power bin,
    which is why their FP8 and FP16 figures match. The difference is memory:
    94 GB HBM3 versus 141 GB HBM3e.
  - >-
    For the Blackwell generation in a PCIe slot, see the RTX PRO 6000 Blackwell
    row in the consumer and workstation table - 96 GB GDDR7 with ECC, dual slot,
    600 W. It is listed there rather than duplicated here.
notes_zh:
  - >-
    功耗才是真正的分界线。70 W 的 L4 或 T4 插进标准服务器不用动任何东西；
    350 W 的 L40S 要考虑风道；最高 600 W 的 H200 NVL 需要为它设计的机箱。
    决定一个机群标准化选哪张卡的通常是这个约束，不是算力。
  - >-
    只有 HBM 卡才有 MIG 和 NVLink 桥接。GDDR6 卡的多卡协作只能走 PCIe，
    各卡显存互不相通；H100 NVL 和 H200 NVL 则可以两卡或四卡通过桥接互联。
  - >-
    H100 NVL 与 H200 NVL 是同一颗 Hopper die、同一个 PCIe 功耗档，
    所以 FP8 和 FP16 数字完全一样。区别在显存：94 GB HBM3 对 141 GB HBM3e。
  - >-
    Blackwell 这一代的 PCIe 选择见"消费级与工作站 GPU"表里的 RTX PRO 6000 Blackwell 一行——
    96 GB GDDR7 带 ECC、双槽、600 W。放在那边，不在此重复。
