id: pcie-gpus
title: Data Center PCIe Cards
title_zh: 数据中心 PCIe 加速卡
summary: >-
  The deployment option that is not an SXM baseboard. What separates these cards
  is power and form factor, not peak FLOPS - a 70 W single-slot card drops into
  any server, a 600 W dual-slot card needs a chassis built for it.
summary_zh: >-
  SXM 基板之外的另一条部署路线。这些卡的区别在功耗和形态，不在峰值算力——
  70 W 单槽卡随便哪台服务器都插得下，600 W 双槽卡得配专门的机箱。
orientation: columns
fields:
  - {key: architecture,  label: Architecture,          label_zh: 架构}
  - {key: memory,        label: Memory,                label_zh: 显存}
  - {key: bandwidth,     label: Memory bandwidth,      label_zh: 显存带宽}
  - {key: fp16,          label: FP16 Tensor,           label_zh: FP16 张量}
  - {key: fp8,           label: FP8 Tensor,            label_zh: FP8 张量}
  - {key: form,          label: Form factor,           label_zh: 形态}
  - {key: pcie,          label: PCIe,                  label_zh: PCIe}
  - {key: nvlink,        label: NVLink,                label_zh: NVLink}
  - {key: mig,           label: MIG,                   label_zh: MIG}
  - {key: power,         label: Max power,             label_zh: 最大功耗}
  - {key: launch,        label: Launch,                label_zh: 上市时间}
