id: radeon-gpus
title: AMD Radeon for Local AI
title_zh: AMD Radeon 本地 AI 显卡
summary: >-
  Radeon's pitch for local inference is VRAM per dollar: a W7900 carries 48 GB
  and an R9700 32 GB where NVIDIA's consumer ceiling is 32 GB. The catch is
  which cards ROCm actually supports.
summary_zh: >-
  Radeon 在本地推理上的卖点是"每块钱能买到多少显存"：W7900 有 48 GB、R9700 有 32 GB，
  而 NVIDIA 消费级的天花板是 32 GB。代价是 ROCm 到底支持哪些卡。
orientation: columns
fields:
  - {key: architecture,   label: Architecture,              label_zh: 架构}
  - {key: cu,             label: Compute units,             label_zh: 计算单元}
  - {key: vram,           label: VRAM,                      label_zh: 显存}
  - {key: bandwidth,      label: Memory bandwidth,          label_zh: 显存带宽}
  - {key: precision,      label: Lowest matrix precision,   label_zh: 最低矩阵精度}
  - {key: rocm,           label: ROCm support,              label_zh: ROCm 支持}
  - {key: multi_gpu,      label: GPU-to-GPU link,           label_zh: 卡间互联}
  - {key: tdp,            label: Board power,               label_zh: 整卡功耗}
  - {key: llm_fit,        label: Rough local LLM fit,       label_zh: 本地 LLM 大致可跑}
  - {key: launch,         label: Launch,                    label_zh: 上市时间}
items:
