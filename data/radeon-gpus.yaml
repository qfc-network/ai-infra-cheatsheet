    name: RX 7900 XTX
    specs:
      architecture: RDNA 3
      cu: 96
      vram: 24 GB GDDR6
      bandwidth: 960 GB/s
      precision: FP16 / INT8 / INT4 (WMMA)
      rocm: officially supported
      multi_gpu: PCIe only
      tdp: 355 W
      llm_fit: ~30B at 4-bit
      launch: 2022
    specs_zh:
      rocm: 官方支持
      multi_gpu: 仅 PCIe
      llm_fit: 约 30B 四位量化
    sources:
      - https://www.amd.com/en/products/graphics/desktops/radeon/7000-series/amd-radeon-rx-7900xtx.html
      - https://rocm.docs.amd.com/en/latest/reference/gpu-specs.html
  - id: rx-9070-xt
    name: RX 9070 XT
    specs:
      architecture: RDNA 4
      cu: 64
      vram: 16 GB GDDR6
      bandwidth: 645 GB/s
      precision: FP8 (RDNA 4 adds FP8 WMMA)
      rocm: supported from ROCm 7.0
      multi_gpu: PCIe only
      tdp: 304 W
      llm_fit: 14B at 4-bit
      launch: 2025
    specs_zh:
      precision: FP8（RDNA 4 新增 FP8 WMMA）
      rocm: ROCm 7.0 起支持
      multi_gpu: 仅 PCIe
      llm_fit: 14B 四位量化
    sources:
      - https://www.amd.com/en/products/graphics/desktops/radeon/9000-series/amd-radeon-rx-9070xt.html
      - https://rocm.docs.amd.com/en/latest/reference/gpu-specs.html
  - id: r9700
    name: Radeon AI PRO R9700
    specs:
      architecture: RDNA 4
      cu: 64
      vram: 32 GB GDDR6
      bandwidth: 645 GB/s
      precision: FP8
      rocm: officially supported, AI-targeted SKU
      multi_gpu: PCIe only
      tdp: 300 W
      llm_fit: ~30B at 4-bit, 70B is tight
      launch: 2025
    specs_zh:
      rocm: 官方支持，面向 AI 的型号
      multi_gpu: 仅 PCIe
      llm_fit: 约 30B 四位量化，70B 很勉强
