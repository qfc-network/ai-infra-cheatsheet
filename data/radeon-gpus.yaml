    name: Radeon PRO W7900
    specs:
      architecture: RDNA 3
      cu: 96
      vram: 48 GB GDDR6
      bandwidth: 864 GB/s
      precision: FP16 / INT8 / INT4 (WMMA)
      rocm: officially supported
      multi_gpu: PCIe only
      tdp: 295 W
      llm_fit: 70B at 4-bit on one card
      launch: 2023
    specs_zh:
      rocm: 官方支持
      multi_gpu: 仅 PCIe
      llm_fit: 单卡 70B 四位量化
    sources:
      - https://rocm.docs.amd.com/en/latest/reference/gpu-specs.html
notes:
  - >-
    Check the ROCm compatibility matrix before buying, not the marketing page.
    AMD's officially supported consumer list is short and version-dependent, and
    unsupported cards often work only through community builds.
  - >-
    Ignore AMD's "5.3 TB/s" figure for the 7900 XTX. That is Infinity Cache
    bandwidth, not memory bandwidth; the GDDR6 number that governs decode speed
    is 960 GB/s.
  - >-
    RDNA 3 has no FP8 matrix path and no FP4 anywhere in the Radeon line, so
    4-bit models are dequantized in software on every card here. Only RDNA 4
    (9070 XT, R9700) adds FP8 WMMA.
  - >-
    Radeon has no NVLink equivalent at any tier. Multi-card is PCIe only, which
    is the same constraint as an RTX 4090/5090 box.
notes_zh:
  - >-
    买之前查 ROCm 兼容性矩阵，别看营销页。AMD 官方支持的消费卡名单很短，
    而且和 ROCm 版本绑定，不在名单里的卡往往只能靠社区编译版本跑。
  - >-
    别把 AMD 给 7900 XTX 标的 "5.3 TB/s" 当带宽。那是 Infinity Cache 的带宽，
    真正决定出词速度的 GDDR6 带宽是 960 GB/s。
  - >-
    RDNA 3 没有 FP8 矩阵通路，整条 Radeon 线都没有 FP4，所以这里每一张卡跑 4bit
    模型都要软件反量化。只有 RDNA 4（9070 XT、R9700）加了 FP8 WMMA。
  - >-
    Radeon 在任何档位都没有 NVLink 的对应物，多卡只能走 PCIe——
    和 RTX 4090/5090 主机是同一个限制。
