notes:
  - >-
    Neither runs CUDA, and neither is a drop-in for a GPU fleet. TPU is XLA
    territory - JAX natively, PyTorch through PyTorch/XLA. Trainium needs the
    Neuron SDK and torch-neuronx. Porting effort, not peak FLOPS, is what
    usually decides whether either is worth it.
  - >-
    Pod scale is where TPU has always been unusual. A TPU7x pod puts 9,216 chips
    on one ICI fabric, against 72 GPUs in a GB300 NVL72 rack and 8,192
    accelerators in a Huawei Atlas 950. Compare domains, not chips.
  - >-
    Trainium3 quotes MXFP8, the OCP microscaling format AMD also uses, while
    TPU quotes plain FP8 and INT8 and NVIDIA quotes NVFP4. Four vendors, three
    incompatible low-precision families.
  - >-
    AWS does not publish a BF16 figure for Trainium3 or a per-chip compute
    number, only UltraServer totals and multipliers against Trainium2. Those
    cells are left as published rather than divided out.
  - >-
    Inferentia2 is not tabled here for lack of a current spec page; it is the
    inference-only sibling of the Trainium line.
notes_zh:
  - >-
    两家都不跑 CUDA，也都不是 GPU 机群的即插即用替代。TPU 是 XLA 的地盘——
    JAX 原生，PyTorch 要经 PyTorch/XLA。Trainium 要用 Neuron SDK 和 torch-neuronx。
    决定值不值得上的通常是移植工作量，不是峰值算力。
  - >-
    pod 规模一直是 TPU 最特别的地方。一个 TPU7x pod 把 9,216 颗芯片挂在同一套 ICI 上，
    对比 GB300 NVL72 一柜 72 卡、华为 Atlas 950 的 8,192 卡。要比互联域，不是比芯片。
  - >-
    Trainium3 标的是 MXFP8（AMD 也在用的 OCP microscaling 格式），
    TPU 标普通 FP8 和 INT8，NVIDIA 标 NVFP4。四家厂商，三套互不兼容的低精度格式。
  - >-
    AWS 没有公布 Trainium3 的 BF16 数字，也没有单芯片算力，只给了 UltraServer 总量
    和相对 Trainium2 的倍数。这些单元格按公布口径原样保留，没有反推单芯片值。
  - >-
    Inferentia2 因为找不到现行规格页没有收录；它是 Trainium 线上只做推理的兄弟型号。
