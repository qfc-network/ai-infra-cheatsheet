id: cloud-accelerators
title: Cloud-Only Accelerators
title_zh: 只能租用的云端加速器
summary: >-
  Google TPU and AWS Trainium are the two largest accelerator fleets you cannot
  buy. Everything else in this repo has a price and a purchase order; these have
  an hourly rate and a region. That is the structural difference, not the specs.
summary_zh: >-
  Google TPU 和 AWS Trainium 是两支买不到的大规模加速器集群。
  本仓库其他所有硬件都有报价单和采购流程，这两家只有按小时计费和可用区。
  真正的差异在这里，不在规格。
orientation: columns
fields:
  - {key: vendor,        label: Vendor,                   label_zh: 厂商}
  - {key: memory,        label: Memory per chip,          label_zh: 单芯片内存}
  - {key: bandwidth,     label: Memory bandwidth,         label_zh: 内存带宽}
  - {key: low_precision, label: Low-precision compute,    label_zh: 低精度算力}
  - {key: bf16,          label: BF16 compute,             label_zh: BF16 算力}
  - {key: interconnect,  label: Interconnect per chip,    label_zh: 单芯片互联}
  - {key: domain,        label: Max domain,               label_zh: 最大互联规模}
  - {key: software,      label: Software,                 label_zh: 软件栈}
  - {key: access,        label: How you get it,           label_zh: 获取方式}
  - {key: launch,        label: Availability,             label_zh: 上市时间}
