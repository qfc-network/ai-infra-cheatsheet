name: Spec correction
description: A number in one of the tables is wrong or missing
title: "[spec] "
labels: [data]
body:
  - type: input
    id: item
    attributes:
      label: Which product / row
      placeholder: DGX B300 -> Max power
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current value in the table
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Correct value
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL (vendor datasheet, product page, or press release)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
